<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify your Apni Gari account</title>
  </head>
  <body style="margin:0;padding:32px 12px;background:#f2f6f7;font-family:Arial,Helvetica,sans-serif;color:#17252b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;">
      <tr>
        <td style="padding:24px 28px;background:#087f8c;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:1px;">
          APNI GARI
        </td>
      </tr>
      <tr>
        <td style="padding:32px 28px 12px;">
          <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;">Verify your email</h1>
          <p style="margin:0;font-size:16px;line-height:1.6;color:#43545b;">
            Enter this code in the Apni Gari app to verify your account:
          </p>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:20px 28px 24px;">
          <div style="display:inline-block;padding:16px 24px;border:1px solid #d5e5e7;border-radius:12px;background:#f6fbfb;color:#087f8c;font-size:32px;font-weight:700;letter-spacing:8px;">
            {{ .Token }}
          </div>
        </td>
      </tr>
      <tr>
        <td style="padding:0 28px 32px;font-size:14px;line-height:1.6;color:#617178;">
          If you didn’t create an Apni Gari account, you can ignore this email.
        </td>
      </tr>
    </table>
  </body>
</html>
