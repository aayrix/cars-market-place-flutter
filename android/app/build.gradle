plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyPropertiesFile = rootProject.file("key.properties")
def releaseKeyProperties = new Properties()
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyPropertiesFile.withInputStream { releaseKeyProperties.load(it) }
}

// Firebase's per-project google-services.json is supplied by the app owner.
// Keep local builds usable until that file is added.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

android {
    namespace "com.mianwali.wheels.mianwali_wheels"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.mianwali.wheels.mianwali_wheels"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    signingConfigs {
        release {
            if (releaseKeyPropertiesFile.exists()) {
                def keyStorePath = releaseKeyProperties.getProperty("storeFile")
                if (keyStorePath) storeFile = rootProject.file(keyStorePath)
                keyAlias = releaseKeyProperties.getProperty("keyAlias")
                storePassword = releaseKeyProperties.getProperty("storePassword")
                keyPassword = releaseKeyProperties.getProperty("keyPassword")
            }
        }
    }
}

def validateReleaseSigning = tasks.register("validateReleaseSigning") {
    doLast {
        def requiredKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
        def missingKeys = requiredKeys.findAll {
            !releaseKeyProperties.getProperty(it)?.trim()
        }
        def keyStorePath = releaseKeyProperties.getProperty("storeFile")
        def keyStoreFile = keyStorePath ? rootProject.file(keyStorePath) : null
        if (!releaseKeyPropertiesFile.exists() || !missingKeys.isEmpty() ||
                keyStoreFile == null || !keyStoreFile.isFile()) {
            throw new GradleException(
                "Release signing is not configured. Create android/key.properties " +
                "and provide a valid upload keystore; see docs/RELEASE.md. " +
                (missingKeys.isEmpty() ? "" : "Missing: ${missingKeys.join(', ')}.")
            )
        }
    }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(validateReleaseSigning)
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source "../.."
}
