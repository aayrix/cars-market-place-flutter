org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Use JDK 17 to run Gradle. JDK 25 (ea) breaks Kotlin DSL script compilation (JavaVersion.parse) and
# Groovy on some Gradle versions ("Unsupported class file major version 69").
# Ubuntu/Debian (OpenJDK 17): typical path below. On Windows/macOS or other installs, set to your JDK 17
# home, or run: flutter config --jdk-dir /path/to/jdk-17
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

