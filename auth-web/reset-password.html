<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Reset Password – Apni Gari</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .status {
      font-size: 16px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .status.success { color: #15803d; }
    .status.error { color: #dc2626; }
    .status.info { color: #2563eb; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
    }
    .btn:hover { background: #1d4ed8; }
    .btn:active { background: #1e40af; transform: scale(0.98); }
    .fallback {
      color: #94a3b8;
      font-size: 13px;
      margin-top: 12px;
    }
    .token-box {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-family: monospace;
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }
    .countdown {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Apni Gari</div>
    <div class="subtitle">Reset your password</div>
    <div id="status" class="status info">Opening the app...</div>
    <a id="openBtn" class="btn" style="display:none;">Open in Apni Gari App</a>
    <div class="fallback">If the app doesn't open, tap the button above.</div>
    <div id="countdown" class="countdown">Redirecting in <span id="seconds">5</span>s...</div>
    <div id="tokenBox" class="token-box"></div>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('openBtn');
      const countdownEl = document.getElementById('countdown');
      const secondsEl = document.getElementById('seconds');
      const tokenBox = document.getElementById('tokenBox');

      // --- Handle errors from Supabase ---
      const errorCode = params.get('error_code');
      const errorDesc = params.get('error_description');

      if (errorCode || errorDesc) {
        statusEl.className = 'status error';
        statusEl.textContent = errorDesc || 'Invalid or expired link. Please request a new password reset.';
        btn.style.display = 'none';
        countdownEl.style.display = 'none';
        return;
      }

      // --- Extract tokens from Supabase redirect ---
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');

      // --- Build the deep link your Flutter app listens to ---
      const deepLink = new URL('com.apnigari.one://login-callback/');
      if (accessToken) deepLink.searchParams.set('access_token', accessToken);
      if (refreshToken) deepLink.searchParams.set('refresh_token', refreshToken);
      if (type) deepLink.searchParams.set('type', type);

      const deepLinkUrl = deepLink.toString();

      // Debug: show the deep link (remove before production if desired)
      tokenBox.style.display = 'block';
      tokenBox.textContent = deepLinkUrl;

      function openApp() {
        window.location = deepLinkUrl;
      }

      // --- Auto redirect when we have a valid recovery link ---
      if (accessToken && refreshToken) {
        statusEl.className = 'status success';
        statusEl.textContent = 'Password reset link received. Opening app...';

        let seconds = 5;
        const timer = setInterval(() => {
          seconds--;
          secondsEl.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(timer);
            openApp();
          }
        }, 1000);

        // Immediate attempt
        setTimeout(openApp, 100);
      } else {
        statusEl.className = 'status error';
        statusEl.textContent = 'Missing reset token. Please request a new password reset email.';
        btn.style.display = 'inline-block';
        btn.href = deepLinkUrl;
        btn.textContent = 'Open in Apni Gari App';
        countdownEl.style.display = 'none';
      }

      // --- Manual button fallback ---
      btn.onclick = function(e) {
        e.preventDefault();
        openApp();
        return false;
      };
    })();
  </script>
</body>
</html>
